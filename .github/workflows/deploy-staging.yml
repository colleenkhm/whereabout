name: Deploy staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/whereabout-web/package-lock.json

      # Dev Supabase project, never prod.
      - name: Build
        working-directory: apps/whereabout-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build

      # Reads wrangler.jsonc at the repo root.
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.153.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
